version: '3.8'

networks:
  ticket_net:
    name: ticket_net

volumes:
  ms_route_data:
  ms_user_data:
  ms_booking_data:
  ms_promotion_data:

x-mysql-env: &mysql_env
  MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
  TZ: "Asia/Ho_Chi_Minh"

x-mysql-common: &mysql_common
  image: mysql:8.4
  restart: unless-stopped
  networks: [ticket_net]
  environment:
    <<: *mysql_env
  command: >
    mysqld
      --lower_case_table_names=1
      --skip-mysqlx
      --skip-name-resolve
      --character_set_server=utf8mb4
      --collation_server=utf8mb4_unicode_ci
      --explicit_defaults_for_timestamp
      --local-infile=1
  healthcheck:
    test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot --silent"]
    interval: 5s
    timeout: 5s
    retries: 20
    start_period: 10s
  labels:
    autoheal: "true"

services:
  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    networks: [ticket_net]
    environment:
      AUTOHEAL_INTERVAL: "5"
      AUTOHEAL_START_PERIOD: "0"
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: "10"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  ms_route-mysql:
    <<: *mysql_common
    environment:
      <<: *mysql_env
      MYSQL_DATABASE: ms_route
    # publish only if you need host access; internal services use 3306
    ports: ["${MS_ROUTE_DB_PORT:-3307}:3306"]
    volumes:
      - ms_route_data:/var/lib/mysql

  ms_user-mysql:
    <<: *mysql_common
    environment:
      <<: *mysql_env
      MYSQL_DATABASE: ms_user
    ports: ["${MS_USER_DB_PORT:-3308}:3306"]
    volumes:
      - ms_user_data:/var/lib/mysql

  ms_booking-mysql:
    <<: *mysql_common
    environment:
      <<: *mysql_env
      MYSQL_DATABASE: ms_booking
    ports: ["${MS_BOOKING_DB_PORT:-3309}:3306"]
    volumes:
      - ms_booking_data:/var/lib/mysql

  ms_promotion-mysql:
    <<: *mysql_common
    environment:
      <<: *mysql_env
      MYSQL_DATABASE: ms_promotion
    ports: ["${MS_PROMOTION_DB_PORT:-3310}:3306"]
    volumes:
      - ms_promotion_data:/var/lib/mysql

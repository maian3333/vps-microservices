# =========================================================
# nginx.conf (hoặc conf.d/ridehub.conf)
# - DNS re-resolve Docker: resolver 127.0.0.11
# - upstream ... resolve; để IP đổi là Nginx tự cập nhật
# - timeout & next_upstream để chịu lỗi tốt hơn
# =========================================================

# Catch-all TLS: chặn mọi subdomain không được phép
server {
    listen 443 ssl default_server;
    server_name ~^.+\.microservices\.appf4s\.io\.vn$;

    ssl_certificate /etc/letsencrypt/live/microservices.appf4s.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/microservices.appf4s.io.vn/privkey.pem;

    return 444;
}

# HTTP -> HTTPS + ACME
server {
    listen 80;
    server_name microservices.appf4s.io.vn;

    # ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- Common HTTP block (nếu file này là nginx.conf gốc) ----------
# Nếu bạn đang dùng conf.d/*.conf thì khối http đặt trong nginx.conf chính.
# Nếu không thể chỉnh nginx.conf gốc, bạn có thể đặt "resolver" trong từng server{}.
# (Khuyến nghị đặt trong http{})
# -----------------------------------------------------------------------
# http {
# Docker DNS
resolver 127.0.0.11 ipv6=off valid=10s;

# Upstreams dùng tên service Docker, kèm 'resolve'
upstream gateway_upstream {
    zone gateway_zone 64k;
    server gateway:8080 resolve;
    keepalive 32;
}
upstream msroute_upstream {
    zone msroute_zone 64k;
    server ms_route:8082 resolve;
    keepalive 16;
}
upstream msuser_upstream {
    zone msuser_zone 64k;
    server ms_user:8083 resolve;
    keepalive 16;
}
upstream mspromotion_upstream {
    zone mspromo_zone 64k;
    server ms_promotion:8085 resolve;
    keepalive 16;
}
upstream msbooking_upstream {
    zone msbooking_zone 64k;
    server ms_booking:8084 resolve;
    keepalive 16;
}

# OPTIONAL: SSL hardening (đặt trong http{} hoặc từng server{})
# ssl_protocols TLSv1.2 TLSv1.3;
# ssl_session_cache shared:SSL:10m;
# ssl_session_timeout 1d;
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# -------- Shared proxy params (có thể đặt 'include' tùy cấu trúc repo) --------
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
# ------------------------------------------------------------------------------

# API Gateway
server {
    listen 443 ssl;
    server_name apigateway.microservices.appf4s.io.vn;

    ssl_certificate /etc/letsencrypt/live/microservices.appf4s.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/microservices.appf4s.io.vn/privkey.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_connect_timeout 5s;

        # Tự động chuyển upstream khi lỗi tạm thời
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}


# ================== ridehub.conf (conf.d) ==================

# Docker DNS resolver
resolver 127.0.0.11 ipv6=off valid=10s;

# -------- Upstreams --------
upstream gateway_upstream {
    zone gateway_zone 64k; server gateway:8080 resolve; keepalive 32;
}
upstream msroute_upstream {
    zone msroute_zone 64k; server ms_route:8082 resolve; keepalive 16;
}
upstream msuser_upstream {
    zone msuser_zone 64k; server ms_user:8083 resolve; keepalive 16;
}
upstream mspromotion_upstream {
    zone mspromo_zone 64k; server ms_promotion:8085 resolve; keepalive 16;
}
upstream msbooking_upstream {
    zone msbooking_zone 64k; server ms_booking:8084 resolve; keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade; '' close;
}

# ===== Catch-all TLS (block subdomain lạ) =====
server {
    listen 443 ssl default_server;
    server_name ~^.+\.phungvip\.io\.vn$;
    ssl_certificate /etc/letsencrypt/live/phungvip.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phungvip.io.vn/privkey.pem;
    return 444;
}

# ===== HTTP -> HTTPS + ACME =====
server {
    listen 80;
    server_name phungvip.io.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ===== API Gateway =====
server {
    listen 443 ssl;
    server_name apigateway.phungvip.io.vn;

    ssl_certificate /etc/letsencrypt/live/phungvip.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phungvip.io.vn/privkey.pem;

    client_max_body_size 50m;

    # Webhook restart (CHỈ endpoint quản trị)
    location /admin/restart {
        limit_except GET POST {
            deny all;
        }

        # forward the client header to webhook
        proxy_set_header X-Admin-Token $http_x_admin_token;

        proxy_pass http://restarter:9000/hooks/restart$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    # Gateway proxy
    location / {
        proxy_pass http://gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_connect_timeout 5s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}

